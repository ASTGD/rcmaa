<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-label="Placeholder department photograph">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#132340"/>
      <stop offset="1" stop-color="#070e1b"/>
    </linearGradient>
    <pattern id="grid2" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0V50" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="1000" fill="url(#wall)"/>
  <rect width="800" height="1000" fill="url(#grid2)"/>

  <!-- Blackboard -->
  <rect x="70" y="120" width="660" height="420" rx="10" fill="#04080f" stroke="#c8a863" stroke-opacity="0.35" stroke-width="3"/>
  <g stroke="#a8d5d8" stroke-opacity="0.35" fill="none" stroke-width="2.5" stroke-linecap="round">
    <path d="M120 240h300M120 300h240M120 360h340M120 420h180"/>
  </g>
  <g fill="#c8a863" fill-opacity="0.4" font-family="Georgia, serif" font-style="italic">
    <text x="500" y="260" font-size="72">&#8721;</text>
    <text x="500" y="360" font-size="48">lim</text>
    <text x="500" y="450" font-size="48">&#8730;n</text>
  </g>

  <!-- Desks -->
  <g fill="#ffffff" fill-opacity="0.07">
    <rect x="90" y="640" width="280" height="18" rx="6"/>
    <rect x="430" y="640" width="280" height="18" rx="6"/>
    <rect x="90" y="770" width="280" height="18" rx="6"/>
    <rect x="430" y="770" width="280" height="18" rx="6"/>
  </g>
  <g fill="#ffffff" fill-opacity="0.1">
    <circle cx="180" cy="600" r="30"/><circle cx="290" cy="600" r="30"/>
    <circle cx="520" cy="600" r="30"/><circle cx="630" cy="600" r="30"/>
    <circle cx="180" cy="730" r="30"/><circle cx="290" cy="730" r="30"/>
    <circle cx="520" cy="730" r="30"/><circle cx="630" cy="730" r="30"/>
  </g>

  <text x="400" y="950" text-anchor="middle" fill="#ffffff" fill-opacity="0.16"
        font-family="ui-monospace, monospace" font-size="15" letter-spacing="6">
    PLACEHOLDER IMAGE
  </text>
</svg>
